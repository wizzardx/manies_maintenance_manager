[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
addopts = --showlocals --ff
filterwarnings =
    # WhiteNoise warns that staticfiles/ is absent; collectstatic isn't run for tests.
    ignore:No directory at:UserWarning
    # datetime.utcnow() deprecation originates in the third-party screenshot plugin.
    ignore::DeprecationWarning:pytest_screenshot_on_failure
    # FORMS_URLFIELD_ASSUME_HTTPS is a transitional opt-in; drop this when on Django 6.0.
    ignore:The FORMS_URLFIELD_ASSUME_HTTPS transitional setting is deprecated:
